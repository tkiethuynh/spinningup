name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenmpi-dev openmpi-bin swig python3-dev

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[pytorch,tf2,box2d]"

      - name: Run pytest suite
        run: |
          pytest -v test/

      - name: Verify Sphinx documentation build
        run: |
          python -m pip install -r docs/docs_requirements.txt
          sphinx-build -b html docs /tmp/docs-out

      - name: Verify non-editable wheel packaging
        run: |
          python -m pip wheel --no-deps -w /tmp/dist .
          python -m pip uninstall -y spinup
          python -m pip install --no-deps /tmp/dist/spinup-*.whl
          cd /tmp && python -c "import sys, spinup; assert 'site-packages/spinup/' in spinup.__file__.replace('\\\\', '/'), spinup.__file__; assert 'torch' not in sys.modules and 'tensorflow' not in sys.modules; from spinup import vpg_pytorch, trpo_pytorch, ppo_pytorch, ddpg_pytorch, td3_pytorch, sac_pytorch, vpg_tf2, trpo_tf2, ppo_tf2, ddpg_tf2, td3_tf2, sac_tf2; import spinup.examples.pytorch.pg_math; import spinup.examples.tf2.pg_math; import spinup.exercises.pytorch.problem_set_1; print(spinup.__version__, spinup.__file__)"
