[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spinup"
dynamic = ["version"]
description = "Modernized version of Spinning Up in Deep RL with TF2, PyTorch 2.x, and Gymnasium."
readme = "readme.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "OpenAI" },
    { name = "Kiet Huynh" },
]
urls = { Homepage = "https://github.com/tkiethuynh/spinningup" }
dependencies = [
    "cloudpickle>=3.0.0",
    "gymnasium[classic-control,mujoco]>=1.0.0",
    "joblib>=1.3.0",
    "matplotlib>=3.8.0",
    "mpi4py>=3.1.5",
    "numpy>=1.26.0,<2.3.0",
    "pandas>=2.1.0",
    "psutil>=5.9.0",
    "pytest>=8.0.0",
    "scipy>=1.13.0",
    "seaborn>=0.13.0",
    "tensorflow==2.20.0",
    "torch==2.10.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
box2d = ["gymnasium[box2d]>=1.0.0"]
atari = ["gymnasium[atari]>=1.0.0"]
genai = ["google-genai>=1.0.0"]
docs = ["sphinx>=7.0.0", "sphinx-rtd-theme>=2.0.0", "myst-parser>=3.0.0"]
all = [
    "gymnasium[atari,box2d,classic-control,mujoco]>=1.0.0",
    "google-genai>=1.0.0",
]

[tool.setuptools.dynamic]
version = { attr = "spinup.version.__version__" }

[tool.setuptools.packages.find]
include = ["spinup*"]
